<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <h1>Guia de requerimento</h1>
    </header>
    <hr>

    <main>
        <form action="">
            
            <label>
                Protocolo n.°
                <input type="number" name="protocol_number" required>
            </label>

            <fieldset>
                
                <label>
                    Requerente:
                    <input type="text" name="requerente" required>
                </label>
                <label>
                    N° DE MATRICULA:
                    <input type="number" name="number_matricula" required>
                </label>
                <hr>
                <label>
                    DATA NASCIMENTO:
                    <input type="date" name="data_nascimento" required>
                </label>
                <label>
                    NATURALIDADE:
                    <select name="naturalidade" required>
                        <optgroup>
                            <legend>CEARÁ</legend>

                            <option value="CEDRO/CE">CEDRO/CE</option>
                            <option value="IGUATU/CE">IGUATU/CE</option>
                            <option value="ICÓ/CE">ICÓ/CE</option>
                            <option value="JUAZEIRO_DO_NORTE/CE">JUAZEIRO DO NORTE/CE</option>
                            <option value="VARZEA_ALEGRE/CE">VARZEA ALEGRE/CE</option>
                        </optgroup>
                        
                    </select>
                </label>
                
                <br>

                <label>
                    FILIAÇÃO:
                    <input type="text" name="filiacao">
                </label>
                <hr>

                <label>
                    CURSO:
                    <select name="curso" required>
                        <option value="">SELECIONE O SEU CURSO</option>
                        <optgroup>
                            <legend>CURSOS TÉCNICOS</legend>

                            <option value="TEC_INFORMATICA">TÉCNICO EM INFORMÁTICA</option>
                            <option value="TEC_ELETRICA">ELETROTÉCNICA</option>
                            <option value="TEC_MECANICA">TÉCNICO EM MECÂNICA</option>
                        </optgroup>

                        <optgroup>
                            <legend>ENSINO SUPERIOR</legend>

                            <option value="SISTEMAS_INFORMAÇÃO">BACHARELADO EM SISTEMAS DE INFORMAÇÃO</option>
                            <option value="SISTEMAS_INFORMAÇÃO">BACHARELADO EM SISTEMAS DE INFORMAÇÃO</option>
                            <option value="LICENCIATURA_FISICA">LICENCIATURA EM FÍSICA</option>
                            <option value="ENGENHARIA_ELETRICA">ENGENHARIA ELÉTRICA</option>
                            <option value="ENGENHARIA_MECANICA">ENGENHARIA MECÂNICA</option>
                        </optgroup>
                        
                    </select>
                </label>

                <label>
                    PERÍODO

                    <input type="text" name="PERIODO" required>
                </label>

                <label>
                    TURNO:
                    <select name="TURNO" required>
                        <option value="">SELECIONE O SEU TURNO</option>
                        <option value="MANHA">MANHÃ</option>
                        <option value="TARDE">TARDE</option>
                        <option value="INTEGRAL">INTEGRAL</option>
                        <option value="NOITE">NOITE</option>  
                    </select>
                </label>

                <br>

                <label>
                    TELEFONE:
                    <input type="tel" name="TELEFONE">
                </label>

                <label>
                    E-MAIL:
                    <input type="email" name="E-MAIL">
                </label>
            </fieldset>

            <fieldset>
                
                <fieldset>
                    <legend>ASSINALE:</legend>

                    <label>
                        <input type="checkbox" name="ACAO" value="2_via">
                        01| 2° Via(especificar) |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Aproveitamento_de_Disciplina">
                        02| Aproveitamento de Disciplina(anezar Histórico Escolar e Programa da Disciplina) |Coordenação do curso
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Matricula_fora_do_prazo">
                        03| Matricula fora do prazo (justificar) |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Cancelamento_da_Matricula">
                        04| Cancelamento da Matrícula |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Colação_de_Grau">
                        05| Colação de Grau/ Coleção Espacial |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Declaracao">
                        06| Declaração (especificar) |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Diploma">
                        07| Diploma (especificar) |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Historico_Escolar">
                        08| Histórico Escolar |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Reabertura_de_Matricula">
                        09| Reabertura de Matrícula |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Segunda_Chamada">
                        10| Segunda Chamada(anexar justificativa e especificar) |Coordenação do Curso
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Reingresso">
                        11| Reingresso |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Trancamento_de_Disciplina">
                        12| Trancamento de Disciplina(especificar) |Coordenação dos Cursos
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Trancamento_de_Matricula">
                        13| Trancamento de Mátricula(anexar documentação comprobatória) |Coordenação dos Pedagógica
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Transferencia_Instituicao">
                        14| Transferência para outra Instituição |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Validar_Conhecimento">
                        15| Validação de conhecimento(especificar) |Coordenação do Cursos
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Reajuste">
                        16| Reajuste |CCA
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="Recorrigir_Prova">
                        17| Recorreção de Prova  |Coordenação do Curso
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="AUXILIO_TRANSPORTE">
                        18| AUXÍLIO - Transporte |Serviço social
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="AUXILIO_MORADIA">
                        19| AUXÍLIO - Moradia |Serviço social
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="AUXILIO_OCULOS">
                        20| AUXÍLIO - Óculos |Serviço social
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="AUXILIO_PAIS_MAES">
                        21| AUXÍLIO - Pais e Mães |Serviço social
                    </label>
                    <br>
                    <label>
                        <input type="checkbox" name="ACAO" value="AUXILIO_TRANSPORTE">
                        22| Outros(especificar) |
                    </label>
                    <br>
                </fieldset>

                <label for="especificar">ESPECIFICAR</label> 
                <br>
                <textarea name="especificacao" id="especificar" cols="100" rows="2"></textarea>
                <br>
                <label for="justificar">JUSTIFICAR</label>
                <br>
                <textarea name="justificacao" id="justificar" cols="100" rows="2"></textarea>
            </fieldset>

            <fieldset>
                <label>
                    <input type="checkbox" name="" required>
                    DECLARO CONHECER O REGIMENTO DESTA IFE, BEM COMO O PRAZO NECESSÁRIO À TRAMITAÇÃO DO PROCESSO
                </label>
                <br>

                <label>
                    REQUERENTE(ASS. LEGÍVEL)
                    <input type="text" name="assinatura_requerente" required>
                </label>
                <br>

                <label>
                    FUNCIONÁRIO(ASS. LEGÍVEL)
                    <input type="text" name="assinatura_funcionario" required>
                    
                </label>
                <br>
                <label>
                    CEDRO-CE,
                    <input type="date">
                </label>
            </fieldset>

            <fieldset>
                <h2>VISTO(COORDENAÇÃO DE ASSUNTOS ESTUDANTIS)</h2>

                <label>
                    <input type="radio" name="chave_armario" value="NAO_DEVE">
                    O requerente NÃO deve chave do armário
                </label>
                <br>

                <label>
                    <input type="radio" name="chave_armario" value="DEVE">
                    O requerente deve chave do armário
                </label>
                <br>

                <label>
                    Responsável(ass. Legível)
                    <input type="text" name="assinatura_funcionario" required>
                </label>

                <hr>
                <h2>VISTO(BIBLIOTECA)</h2>

                <label>
                    <input type="radio" name="livros" value="NAO_DEVE">
                    O requerente NÃO deve livros na biblioteca
                </label>
                <br>

                <label>
                    <input type="radio" name="livros" value="DEVE">
                    O requerente deve livros na biblioteca
                </label>
                <br>

                <label>
                    Responsável(ass. Legível)
                    <input type="text" name="assinatura_funcionario" required>
                </label>
            </fieldset>

            <hr>
            <!-- Não aguentei deixar o botão pequeno -->
            <input type="submit" value="Enviar Requerimento" style="font-size: 15px; padding: 5px 10px;">
        </form>

    </main>
    
</body>
</html>
